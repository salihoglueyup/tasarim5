# Nginx Yapılandırma Dosyası (Host Makine İçin)
# Bu dosyayı sunucudaki /etc/nginx/sites-available/aloyonetim.conf olarak kaydedip
# ln -s /etc/nginx/sites-available/aloyonetim.conf /etc/nginx/sites-enabled/
# komutuyla aktifleştirebilirsin.
#
# NOT: Cloudflare Full SSL kullanıldığında HTTP→HTTPS yönlendirmesi Cloudflare tarafında
# yapılır. Origin (bu sunucu) HTTP üzerinde çalışabilir; HSTS zaten Next.js header'larında var.
# Certbot ile origin SSL eklemek için: sudo certbot --nginx -d aloyonetim.com.tr ...

# 1. Ana Web Sitesi (Next.js) - Port 3001
server {
    listen 80;
    listen [::]:80;
    server_name aloyonetim.com.tr www.aloyonetim.com.tr;

    # Faz 236: Gzip ve Brotli Yüksek Performanslı Sıkıştırma (Ters Vekil / Reverse Proxy)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/x-javascript
        application/ld+json
        image/svg+xml;

    # Brotli Sıkıştırma (ngx_brotli modülü kurulu ortamlar için)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/ld+json
        image/svg+xml;

    # Proxy buffer ayarları (Next.js standalone için önerilir)
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Gerçek IP adreslerini Next.js'e iletmek için
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Statik dosyalar için önbellek (Next.js public ve _next/static klasörleri)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|avif|webp)$ {
        proxy_pass http://localhost:3001;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# 2. n8n Otomasyon - Port 5678
server {
    listen 80;
    listen [::]:80;
    server_name n8n.aloyonetim.com.tr;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;

        # WebSocket desteği (n8n için gerekli)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout süreleri (Uzun süren n8n iş akışları için)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
