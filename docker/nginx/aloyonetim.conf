# Nginx Yapılandırma Dosyası (Host Makine İçin)
# Bu dosyayı sunucudaki /etc/nginx/sites-available/aloyonetim.conf olarak kaydedip
# ln -s /etc/nginx/sites-available/aloyonetim.conf /etc/nginx/sites-enabled/
# komutuyla aktifleştirebilirsin.

# 1. Ana Web Sitesi (Next.js) - Port 3001
server {
    listen 80;
    listen [::]:80;
    server_name aloyonetim.com www.aloyonetim.com;

    # Gzip Sıkıştırması
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Gerçek IP adreslerini Next.js'e iletmek için
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik dosyalar için önbellek (Next.js public ve _next/static klasörleri)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|avif|webp)$ {
        proxy_pass http://localhost:3001;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# 2. n8n Otomasyon - Port 5678
server {
    listen 80;
    listen [::]:80;
    server_name n8n.aloyonetim.com;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;
        
        # WebSocket desteği (n8n için gerekli)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout süreleri (Uzun süren n8n iş akışları için)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# NOT: SSL Kurulumu için sunucuda aşağıdaki komutu çalıştırabilirsin:
# sudo certbot --nginx -d aloyonetim.com -d www.aloyonetim.com -d n8n.aloyonetim.com
