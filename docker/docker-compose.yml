services:
  postgres:
    image: postgres:15-alpine
    container_name: aloyonetim-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: alo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alo_super_secret_2026}
      POSTGRES_DB: aloyonetim
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Yalnız localhost'a bind — veritabanı dış ağa açılmaz (secret'lar docker/.env'de).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alo_user -d aloyonetim"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:alpine
    container_name: aloyonetim-redis
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    # Redis'e parola zorunluluğu — boş kaldığında çökmesini önleyen varsayılan fallback eklendi.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-alo_redis_secret_2026}
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alo_redis_secret_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: aloyonetim-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    ports:
      # 127.0.0.1 bind — nginx host'ta proxy yapıyor, dış ağa açılmaz.
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Secret'lar .env veya docker/.env dosyasından gelir (git-ignored).
      - DATABASE_URL=postgresql://alo_user:${POSTGRES_PASSWORD:-alo_super_secret_2026}@postgres:5432/aloyonetim?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alo_redis_secret_2026}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-alo_jwt_secret_key_2026_super_secure}
      # N8N webhook URL
      - N8N_URL=http://n8n:5678
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: aloyonetim-n8n
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    ports:
      # n8n yönetim paneli yalnız localhost'ta — dış ağa açılmaz (tünel/proxy ile erişilir).
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=n8n.aloyonetim.com.tr
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.aloyonetim.com.tr/
      - GENERIC_TIMEZONE=Europe/Istanbul
      # PostgreSQL backend — SQLite'tan geçiş yapıldı
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=aloyonetim
      - DB_POSTGRESDB_USER=alo_user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-alo_super_secret_2026}
      - DB_POSTGRESDB_SCHEMA=n8n
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - ./data/n8n:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 1g

  prisma-studio:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: aloyonetim-prisma-studio
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    command: npx prisma studio --port 5555 --browser none
    # GÜVENLIK: Prisma Studio DB'ye tam erişim verir — porta dış publish YOK.
    # Gerektiğinde SSH tüneli veya `docker compose exec` ile erişilir.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://alo_user:${POSTGRES_PASSWORD:-alo_super_secret_2026}@postgres:5432/aloyonetim?schema=public
    deploy:
      resources:
        limits:
          memory: 256m
