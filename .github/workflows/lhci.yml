name: Lighthouse CI (LHCI) Audit (Faz 249)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lhci:
    name: Lighthouse CI 100/100 SEO & Performance Audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/alo_yonetim"
      JWT_SECRET: "ci-dummy-jwt-secret-key-at-least-32-chars-long"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build

      - name: Run Lighthouse CI (Faz 249: 100/100 SEO Requirement)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.seo.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
