name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: TypeCheck, Tests, Lint & Bundle Audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/alo_yonetim"
      JWT_SECRET: "ci-dummy-jwt-secret-key-at-least-32-chars-long"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck (Faz 231)
        run: npx tsc --noEmit

      - name: Run Vitest Test Suite (Faz 231)
        run: npx vitest run

      - name: Next.js Production Build (Faz 231)
        run: npm run build

      - name: Bundle Size Budget Verification (Faz 232)
        run: node scripts/check-bundle-budget.js

      - name: Lighthouse CI SEO 100/100 Configuration Verification (Faz 249)
        run: node -e "const c = require('./lighthouserc.seo.json'); if (c.ci.assert.assertions['categories:seo'][1].minScore < 1.0) process.exit(1); console.log('LHCI 100/100 SEO rule verified');"
